[package]
name = "analytic-intelligence"
version = "0.2.0"
edition = "2024"

[dependencies]
# rustls-tls instead of the default native-tls: ipinfo.io's WAF rejects the
# OpenSSL client hello with 406 Not Acceptable
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
serde = { version = "1.0", features = ["derive"] }
trust-dns-resolver = { version = "0.23", features = ["dns-over-rustls"] }
# Explicit ring provider so the TLS probe does not pull in aws-lc-rs
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.16"
rand = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
ratatui = "0.30"
crossterm = "0.29"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
